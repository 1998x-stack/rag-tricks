title: RAG Tricks · RAG 工程知识库
description: 可追溯、可验证、面向生产实践的 RAG 工程知识库
url: https://1998x-stack.github.io
baseurl: /rag-tricks
theme: jekyll-theme-cayman
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
relative_links:
  enabled: true
  collections: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - raw
  - scripts
  - tools
  - tests
  - docs/superpowers
  - requirements-dev.txt
  - CLAUDE.md
include:
  - README.md
  - CONTRIBUTING.md
optional_front_matter:
  remove_originals: true
