name: Quartz site

on:
  pull_request:
    paths:
      - 'wiki/**'
      - 'sources/**'
      - 'index.md'
      - 'contradictory.md'
      - 'SOURCE_POLICY.md'
      - 'CONTRIBUTING.md'
      - 'site/**'
      - 'scripts/prepare_quartz_content.py'
      - '.github/workflows/quartz-site.yml'
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quartz-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  QUARTZ_REPOSITORY: https://github.com/jackyzha0/quartz.git
  QUARTZ_COMMIT: d25a6eabf96751ffca56f8a8139272def7a65041

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout RAG Tricks
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch pinned Quartz engine
        run: |
          git clone --filter=blob:none "$QUARTZ_REPOSITORY" .quartz-engine
          git -C .quartz-engine checkout --detach "$QUARTZ_COMMIT"
          test "$(git -C .quartz-engine rev-parse HEAD)" = "$QUARTZ_COMMIT"

      - name: Prepare content
        run: python3 scripts/prepare_quartz_content.py --output .quartz-engine/content

      - name: Apply RAG Tricks Quartz configuration
        run: |
          cp site/quartz.config.ts .quartz-engine/quartz.config.ts
          cp site/quartz.layout.ts .quartz-engine/quartz.layout.ts

      - name: Install pinned Quartz dependencies
        working-directory: .quartz-engine
        run: npm ci

      - name: Build Quartz
        working-directory: .quartz-engine
        run: npx quartz build

      - name: Validate generated site
        run: |
          test -f .quartz-engine/public/index.html
          test -f .quartz-engine/public/static/contentIndex.json
          test -f .quartz-engine/public/wiki/retrieval/hybrid-retrieval.html
          test -f .quartz-engine/public/wiki/ops-and-reliability/failure-postmortem.html

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .quartz-engine/public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
